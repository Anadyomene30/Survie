<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survie</title>
<style>
  :root {
    color-scheme: dark;
    --fond: #14110e; --carte: #1e1a16; --bord: #3a332c;
    --texte: #ede8e1; --doux: #a49a8e; --accent: #d98c3f; --alerte: #d9534f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1rem; background: var(--fond); color: var(--texte);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 46rem; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: .2rem 0 1rem; letter-spacing: .02em; }
  h1 span { color: var(--doux); font-weight: 400; font-size: .8rem; }
  form { display: flex; gap: .5rem; }
  input {
    flex: 1; padding: .85rem 1rem; font-size: 1.05rem; border-radius: .6rem;
    border: 1px solid var(--bord); background: var(--carte); color: var(--texte);
  }
  input:focus { outline: 2px solid var(--accent); }
  button {
    padding: .85rem 1.3rem; font-size: 1.05rem; font-weight: 600;
    border: 0; border-radius: .6rem; background: var(--accent); color: #14110e;
    cursor: pointer;
  }
  label.eco {
    display: flex; align-items: center; gap: .45rem;
    margin: .7rem 0 0; color: var(--doux); font-size: .9rem;
  }
  #reponse {
    margin-top: 1.4rem; white-space: pre-wrap; background: var(--carte);
    border: 1px solid var(--bord); border-left: 3px solid var(--accent);
    border-radius: .6rem; padding: 1rem 1.1rem;
  }
  #reponse:empty { display: none; }
  #reponse.refus { border-left-color: var(--alerte); }
  #fiches { margin-top: .8rem; color: var(--doux); font-size: .88rem; }
  details { margin-top: 1rem; }
  summary { cursor: pointer; color: var(--doux); }
  details article {
    margin-top: .8rem; padding: .8rem 1rem; background: var(--carte);
    border: 1px solid var(--bord); border-radius: .5rem; white-space: pre-wrap;
  }
  details article b { color: var(--accent); font-weight: 600; }
  footer { margin-top: 2rem; color: var(--doux); font-size: .8rem; }
</style>
</head>
<body>
<main>
  <h1>Survie <span id="etat">—</span></h1>

  <form id="formulaire">
    <input id="question" placeholder="Ex : rendre potable l'eau d'une mare"
           autocomplete="off" autofocus>
    <button type="submit">Chercher</button>
  </form>
  <label class="eco">
    <input type="checkbox" id="eco"> Sources seules (sans IA — economise la batterie)
  </label>

  <div id="reponse"></div>
  <div id="fiches"></div>
  <details id="bloc-extraits" hidden>
    <summary>Extraits des fiches</summary>
    <div id="extraits"></div>
  </details>

  <footer>
    Fonctionne hors ligne. Les reponses proviennent uniquement des fiches
    installees sur cette machine. En cas de doute vital, lisez la fiche source
    entiere.
  </footer>
</main>

<script>
const $ = (id) => document.getElementById(id);

fetch("/api/etat").then(r => r.json()).then(e => {
  $("etat").textContent =
    `profil ${e.profil} · ${e.fragments} fragments · ${e.llm ? "IA active" : "recherche seule"}`;
  if (!e.llm) { $("eco").checked = true; $("eco").disabled = true; }
});

$("formulaire").addEventListener("submit", async (evenement) => {
  evenement.preventDefault();
  const question = $("question").value.trim();
  if (!question) return;

  $("reponse").className = "";
  $("reponse").textContent = "Recherche…";
  $("fiches").textContent = "";
  $("bloc-extraits").hidden = true;

  try {
    const url = `/api/demande?q=${encodeURIComponent(question)}`
              + `&sources_seules=${$("eco").checked}`;
    const donnees = await (await fetch(url)).json();

    $("reponse").textContent = donnees.texte;
    if (donnees.mode === "refus") $("reponse").className = "refus";
    if (donnees.fiches?.length) {
      $("fiches").textContent = "Fiches consultees : " + donnees.fiches.join(", ");
    }
    if (donnees.mode === "redige" && donnees.extraits?.length) {
      $("extraits").replaceChildren(...donnees.extraits.map(extrait => {
        const article = document.createElement("article");
        const titre = document.createElement("b");
        titre.textContent = extrait.reference;
        article.append(titre, document.createTextNode("\n" + extrait.texte));
        return article;
      }));
      $("bloc-extraits").hidden = false;
    }
  } catch (erreur) {
    $("reponse").className = "refus";
    $("reponse").textContent = "Le service local ne repond pas : " + erreur.message;
  }
});
</script>
</body>
</html>
