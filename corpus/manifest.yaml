    priorite: 3
    format: zim
    chemin: corpus/public/wikipedia_fr_all_nopic.zim
    note: >-
      Ingestion SÉLECTIVE par semences thématiques (corpus/zim-seeds.yaml) :
      quelques dizaines de milliers d'articles, jamais les 2,5 millions.
      Forcée en priorité 3 — c'est un repli, jamais une source de référence.
      L'archive n'est pas téléchargée automatiquement (une dizaine de Go) :
      la récupérer sur https://library.kiwix.org et la déposer à ce chemin.
      La variante « nopic » suffit et divise la taille par cinq.

