# Catalogue des sources du corpus SURVIE.
#
# `licence` pilote le comportement du pipeline :
#   public-domain / cc-*  -> téléchargé automatiquement par `make fetch`
#   copyright             -> JAMAIS téléchargé. À déposer manuellement dans corpus/private/.
#
# `priorite` pondère le retrieval (1 = source de référence, 3 = repli).
# `date` sert à afficher l'ancienneté des sources médicales (doctrines évolutives).
# `langue` : fr / en. Le français est privilégié à score égal.

version: 1

sources:

