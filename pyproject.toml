[project]
name = "survie"
version = "0.1.0"
description = "Assistant IA local et hors-ligne pour l'adaptation a une catastrophe"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.3.0"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
survie = "survie.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
